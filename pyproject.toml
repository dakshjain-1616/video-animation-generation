[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vga"
version = "0.2.0"
description = "Idea to a researched, visually consistent 20-60 second explainer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vga = "vga.cli:main"

[tool.setuptools]
packages = ["vga"]

[tool.setuptools.package-data]
vga = []
